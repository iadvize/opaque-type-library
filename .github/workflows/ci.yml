name: Continuous integration

on:
  push:
    branches-ignore:
      - 'gh-pages'
    tags-ignore:
      - '*'

jobs:
  install:
    name: 'install and build'
    runs-on: ubuntu-18.04

    steps:
    - uses: actions/checkout@a6747255bd19d7a757dbdda8c654a9f84db19839 # v2-beta

    - uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
      with:
        node-verion: '12.x'

    - name: Cache npm cache
      uses: actions/cache@f5ce41475b483ad7581884324a6eca9f48f8dcc7 # v1.2.1
      with:
        path: ~/.npm
        key: v2-npm-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          v2-npm-

    - name: Restore package
      id: node-modules-cache
      uses: actions/cache@f5ce41475b483ad7581884324a6eca9f48f8dcc7 # v1.2.1
      with:
        path: node_modules
        key: v2-node_modules-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          v2-node_modules-

    - name: Install
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      run: npm ci

  lint:
    name: 'lint'
    runs-on: ubuntu-18.04

    needs:
      - install

    steps:
    - uses: actions/checkout@a6747255bd19d7a757dbdda8c654a9f84db19839 # v2-beta

    - uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
      with:
        node-verion: '12.x'

    - name: Restore package
      uses: actions/cache@f5ce41475b483ad7581884324a6eca9f48f8dcc7 # v1.2.1
      id: node-modules-cache
      with:
        path: node_modules
        key: v2-node_modules-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          v2-node_modules-

    - name: Lint
      run: npm run lint:js

  test:
    name: 'test'
    runs-on: ubuntu-18.04

    needs:
      - install

    steps:
    - uses: actions/checkout@a6747255bd19d7a757dbdda8c654a9f84db19839 # v2-beta

    - uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
      with:
        node-verion: '12.x'

    - name: Restore package
      uses: actions/cache@f5ce41475b483ad7581884324a6eca9f48f8dcc7 # v1.2.1
      id: node-modules-cache
      with:
        path: node_modules
        key: v2-node_modules-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          v2-node_modules-

    - name: Build
      run: npm run build

    - name: Test
      run: npm run test:js
